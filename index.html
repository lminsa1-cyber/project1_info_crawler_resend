<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>📊 AI & IT 핵심 뉴스/정책 실무 대시보드</title>
    <!-- Stlite (Streamlit on WebAssembly) CSS 및 런타임 로드 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/stlite.css"
    />
    <style>
      /* 대시보드 로딩 진행 시 안내 문구 스타일링 */
      #loading-msg {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        color: #0f172a;
        background-color: #ffffff;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #10b981;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- 로딩 메시지 (브라우저 내부에서 파이썬 런타임을 구성하는 동안 잠시 표출) -->
    <div id="loading-msg">
      <div class="spinner"></div>
      <h2 style="margin: 0; font-weight: 700;">📊 AI 실무 뉴스 대시보드 로딩 중...</h2>
      <p style="color: #64748b; margin-top: 8px; font-size: 14px;">브라우저 내 파이썬 엔진(WebAssembly) 및 라이브러리 가동 중입니다. 잠시만 기다려주세요.</p>
    </div>

    <!-- 대시보드가 렌더링될 메인 루트 영역 -->
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          // Pyodide 내에 자동 빌드할 파이썬 의존성 패키지들 정의
          requirements: ["matplotlib"], 
          entrypoint: "app/streamlit_app.py",
          files: {
            // 1. 메인 스트림릿 대시보드 파이썬 코드 주입
            "app/streamlit_app.py": {
              url: "app/streamlit_app.py",
            },
            // 2. 가용할 수집-정제-알고리즘 추천 가상 CSV 파일 주입
            "data/processed/recommended_policy_news.csv": {
              url: "data/processed/recommended_policy_news.csv",
            },
            "data/processed/cleaned_policy_news.csv": {
              url: "data/processed/cleaned_policy_news.csv",
            },
            "data/raw/crawled_policy_news.csv": {
              url: "data/raw/crawled_policy_news.csv",
            }
          },
        },
        document.getElementById("root")
      );

      // 스트림릿 로딩이 완료되면 로딩 인디케이터 숨기기
      window.addEventListener("DOMContentLoaded", () => {
        const observer = new MutationObserver((mutations, obs) => {
          const mainApp = document.querySelector(".stApp");
          if (mainApp) {
            document.getElementById("loading-msg").style.display = "none";
            obs.disconnect();
          }
        });
        observer.observe(document.getElementById("root"), {
          childList: true,
          subtree: true
        });
      });
    </script>
  </body>
</html>
